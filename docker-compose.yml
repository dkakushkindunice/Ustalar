services:
  app:
    build:
      context: ./Ustalar
      dockerfile: Dockerfile
    image: ustalar-app:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=${DB_CONNECTION:-Host=postgres;Port=5432;Database=ustalar;Username=ustalar;Password=ustalar_pass}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ustalar-net

  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: ustalar
      POSTGRES_USER: ustalar
      POSTGRES_PASSWORD: ustalar_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ustalar -d ustalar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ustalar-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - ustalar-net

networks:
  ustalar-net:
    driver: bridge

volumes:
  pgdata:
